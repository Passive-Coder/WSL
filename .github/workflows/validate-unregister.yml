name: Reproduce Copilot unregister findings on Windows
on:
  push:
    branches: [fix/validate-unregister-recovery]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            bin/x64/Release
            packages
          key: unregister-recovery-legacy-cleanup
          fail-on-cache-miss: true
      - name: Install previously built WSL
        shell: pwsh
        run: |
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force
          .\tools\test\test-setup.ps1 -Version 2 -Package .\bin\x64\Release\installer.msix -AllowUnsigned
      - name: Reproduce both review findings
        shell: pwsh
        run: .\.github\scripts\reproduce-unregister.ps1
