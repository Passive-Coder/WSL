name: Probe recovery directory sharing
on:
  push:
    branches: [fix/validate-unregister-recovery]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run directory sharing probe
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          cl /std:c++17 /EHsc .github\scripts\probe-directory.cpp /Fe:probe.exe
          if errorlevel 1 exit /b 1
          probe.exe
