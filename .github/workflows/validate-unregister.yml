name: Probe recovery directory sharing
on:
  push:
    branches: [fix/validate-unregister-recovery]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run directory sharing probe
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          cl /std:c++17 /EHsc .github\scripts\probe-directory.cpp /Fe:probe.exe
          if errorlevel 1 exit /b 1
          probe.exe
