name: Diagnose recovery test setup
on:
  push:
    branches: [fix/validate-unregister-recovery]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            bin/x64/Release
            packages
          key: unregister-recovery-af560a35
          fail-on-cache-miss: true
      - name: Enable developer mode
        shell: pwsh
        run: New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force
      - name: Set up WSL 2 with visible output
        shell: powershell
        run: tools/test/test-setup.ps1 -Version 2 -DistroPath packages/Microsoft.WSL.TestDistro.2.7.1-1/x64/test_distro.tar.xz -DistroName test_distro -Package bin/x64/Release/installer.msix -UnitTestsPath "$pwd/test/linux/unit_tests" -AllowUnsigned
      - name: Run WSL 2 regressions
        shell: cmd
        run: bin\x64\Release\test.bat -Fast /name:UnitTests::UnitTests::*Unregister*
      - name: Set up WSL 1 with visible output
        shell: powershell
        run: tools/test/test-setup.ps1 -Version 1 -DistroPath packages/Microsoft.WSL.TestDistro.2.7.1-1/x64/test_distro.tar.xz -DistroName test_distro -Package bin/x64/Release/installer.msix -UnitTestsPath "$pwd/test/linux/unit_tests" -AllowUnsigned
      - name: Run WSL 1 regressions
        shell: cmd
        run: bin\x64\Release\test.bat -Fast -Version 1 /name:UnitTests::UnitTests::*Unregister*
      - name: Run help regression
        shell: cmd
        run: bin\x64\Release\test.bat -Fast /name:UnitTests::UnitTests::UsageMessages
