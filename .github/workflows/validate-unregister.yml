name: Validate unregister recovery on Windows
on:
  push:
    branches: [fix/validate-unregister-recovery]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore the exact Windows build
        uses: actions/cache/restore@v4
        with:
          path: |
            bin/x64/Release
            packages
          key: unregister-recovery-journal-sharing-v2
          fail-on-cache-miss: true
      - name: Enable unsigned test package installation
        shell: pwsh
        run: New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force
      - name: Install previously built WSL
        shell: pwsh
        run: .\tools\test\test-setup.ps1 -Version 2 -Package .\bin\x64\Release\installer.msix -AllowUnsigned
      - name: Reproduce latest review findings
        shell: pwsh
        run: .\.github\scripts\reproduce-followup.ps1
